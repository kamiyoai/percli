name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (fmt, clippy, test, scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p percli -p percli-core -p percli-wasm -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude percli-chain --exclude percli-program

      - name: Run bundled scenarios
        run: |
          cargo build -p percli --release
          for f in scenarios/*.toml; do
            echo "--- $f ---"
            cargo run -p percli --release -- sim "$f"
          done

  chain:
    name: Chain (Solana / Anchor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libudev-dev

      - name: Build percli with chain feature
        run: cargo build -p percli --features chain

      - name: Build percli-program (host)
        run: cargo build -p percli-program

      - name: Clippy (chain crates)
        run: cargo clippy -p percli-chain -p percli-program -- -D warnings

  sbf:
    name: SBF build + on-chain integration tests
    runs-on: ubuntu-latest
    # Solana CLI install is the long pole here; cache it explicitly.
    env:
      SOLANA_CLI_VERSION: v2.2.0
      # Pin the SBF artifact path so the test runner can find it.
      BPF_OUT_DIR: ${{ github.workspace }}/target/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libudev-dev

      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: solana-${{ env.SOLANA_CLI_VERSION }}-platform-tools-${{ runner.os }}

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/${{ env.SOLANA_CLI_VERSION }}/install)"

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Solana CLI
        run: solana --version

      - name: Build SBF artifact
        run: |
          cargo build-sbf \
            --manifest-path crates/percli-program/Cargo.toml

      - name: Run on-chain integration tests
        run: |
          cargo test \
            -p percli-program \
            --test integration \
            --no-fail-fast
