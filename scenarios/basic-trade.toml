# Basic Two-Party Trade
# Alice goes long, Bob goes short. Price moves. Observe equity changes.
#
# Run: percli sim scenarios/basic-trade.toml

[meta]
name = "Basic Two-Party Trade"
description = "Alice goes long, Bob goes short. Price rises 10%. Observe equity changes."

[params]
warmup_period_slots = 100
maintenance_margin_bps = 500
initial_margin_bps = 1000

[market]
initial_oracle_price = 1000
initial_slot = 0

[[steps]]
action = "deposit"
account = "alice"
amount = 100_000

[[steps]]
action = "deposit"
account = "bob"
amount = 100_000

[[steps]]
action = "crank"
oracle_price = 1000
slot = 1

[[steps]]
action = "trade"
long = "alice"
short = "bob"
size = 50
price = 1000

[[steps]]
action = "crank"
oracle_price = 1100
slot = 200
comment = "Price rises 10%"

[[steps]]
action = "query"
metric = "summary"

[[steps]]
action = "assert"
condition = "conservation"
