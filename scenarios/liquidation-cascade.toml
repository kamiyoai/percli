# Liquidation Cascade
# High-leverage trade meets a price crash. Watch the liquidation engine work.
#
# Run: percli sim scenarios/liquidation-cascade.toml

[meta]
name = "Liquidation Cascade"
description = "High-leverage position meets 50% price crash. Liquidation fires, insurance absorbs losses."

[params]
warmup_period_slots = 100
maintenance_margin_bps = 500
initial_margin_bps = 1000
liquidation_fee_bps = 100

[market]
initial_oracle_price = 1000
initial_slot = 0

[[steps]]
action = "deposit"
account = "alice"
amount = 100_000

[[steps]]
action = "deposit"
account = "bob"
amount = 100_000

[[steps]]
action = "crank"
oracle_price = 1000
slot = 1

[[steps]]
action = "trade"
long = "alice"
short = "bob"
size = 80
price = 1000
comment = "80x size on 100k capital — high leverage"

[[steps]]
action = "crank"
oracle_price = 500
slot = 200
comment = "Price crashes 50%"

[[steps]]
action = "query"
metric = "summary"
comment = "Alice should be below maintenance margin"

[[steps]]
action = "liquidate"
account = "alice"

[[steps]]
action = "query"
metric = "summary"
comment = "Post-liquidation state"

[[steps]]
action = "assert"
condition = "conservation"
